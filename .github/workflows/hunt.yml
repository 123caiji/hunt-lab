name: hunt

on:
  schedule:
    - cron: '41 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install nuclei
        run: |
          V=$(curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | jq -r .tag_name | tr -d v)
          curl -sL -o nuclei.zip "https://github.com/projectdiscovery/nuclei/releases/download/v${V}/nuclei_${V}_linux_amd64.zip"
          unzip -o -q nuclei.zip nuclei && sudo mv nuclei /usr/local/bin/ && nuclei -version
      - name: run hunt
        run: node scripts/hunt.mjs
      - name: commit results
        run: |
          git config user.name 123caiji
          git config user.email 166346449+123caiji@users.noreply.github.com
          git add data reports
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "hunt: $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
